<!DOCTYPE html>
<html lang="bg">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/stavia-demo-web/console/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Phone width from the first moment: the start screen is laid out before Flutter adds its own. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stavia demo app. Sample data and simulated payments only.">
  <!-- A demo with sample data: not for search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B1220">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stavia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stavia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown until Flutter draws its first frame: the Stavia mark on ink, like the phone apps. */
    html, body { margin: 0; height: 100%; background: #0B1220; }
    #stavia-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #stavia-splash circle { transform-origin: 67px 18px; animation: stavia-pulse 1.6s ease-in-out infinite; }
    @keyframes stavia-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { #stavia-splash circle { animation: none; } }
  </style>
</head>
<body>
  <div id="stavia-splash" aria-hidden="true">
    <svg viewBox="0 0 100 100" width="150" height="150"><g transform="translate(2 3)"><path d="M50 18 H42 A15 15 0 0 0 42 48 H54 A15 15 0 0 1 54 78 H40" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="67" cy="18" r="8" fill="#FF5A3C"/></g></svg>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
